name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: setwise
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d setwise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BETTER_AUTH_SECRET: setwise-ci-only-secret-not-used-outside-actions
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_DRIVER: pg
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/setwise
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/setwise

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install local test database driver
        run: npm install --no-save --package-lock=false pg@8.16.3

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Apply database migrations
        run: npm run db:migrate

      - name: Seed exercise catalogue
        run: npm run db:seed

      - name: Run integration tests
        run: npm test
