name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test, lint and format
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: setwise
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d setwise"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      BETTER_AUTH_SECRET: setwise-ci-only-secret-not-used-outside-actions
      BETTER_AUTH_URL: http://localhost:3000
      DATABASE_DRIVER: pg
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/setwise
      DATABASE_URL_UNPOOLED: postgresql://postgres:postgres@127.0.0.1:5432/setwise

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Formatting is a root task: one Prettier pass covers every workspace.
      - name: Check formatting
        run: pnpm format:check

      # One matrix in packages/eslint-config/boundaries.js drives both this and
      # the no-restricted-imports rules each workspace lints with.
      - name: Check dependency boundaries
        run: pnpm boundaries

      - name: Lint
        run: pnpm turbo run lint

      - name: Verify shadcn integration
        run: pnpm dlx shadcn@latest info --json
        working-directory: apps/web

      - name: Check database migrations
        run: pnpm turbo run db:check

      - name: Apply database migrations
        run: pnpm --filter @setwise/web db:migrate

      - name: Seed exercise catalogue
        run: pnpm --filter @setwise/web db:seed

      # `build` runs `vite build && tsc --noEmit`, so this also type-checks.
      - name: Build production server
        run: pnpm turbo run build

      - name: Check bundle budgets
        run: pnpm --filter @setwise/web check:bundle

      - name: Run integration tests
        run: pnpm turbo run test

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium
        working-directory: apps/web

      - name: Run browser smoke tests
        run: pnpm turbo run e2e --filter=@setwise/web
